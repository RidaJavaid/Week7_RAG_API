name: CI — Install & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run ingestion tests
        run: pytest tests/test_ingestion_day3.py -v

      - name: Run cost-tracker tests
        run: pytest tests/test_cost_tracker.py -v

      - name: Run API tests
        run: pytest tests/test_api.py -v

      - name: Run auto-ingest tests
        run: pytest tests/test_auto_ingest.py -v
